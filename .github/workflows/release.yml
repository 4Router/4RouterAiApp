name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── Read version & check if release already exists ──
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.check_tag.outputs.exists }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION"

      - name: Check if tag already exists
        id: check_tag
        shell: bash
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Tag ${{ steps.version.outputs.tag }} already exists, skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "🆕 Tag ${{ steps.version.outputs.tag }} is new, proceeding with build."
          fi

  # ── Windows (NSIS installer) ──
  build-windows:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # node-pty ships N-API prebuilds (incl. bundled conpty.dll), so no
      # node-gyp compile or electron-rebuild step is needed.
      - name: Install dependencies
        run: npm install

      - name: Compile TypeScript (main process)
        run: npx tsc -p tsconfig.main.json

      - name: Build Vite (renderer)
        run: npx vite build

      - name: Bundle Node.js runtime and CLI tools
        run: node scripts/bundle-tools.mjs

      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: electron-builder-cache-${{ runner.os }}-nsis

      - name: Package Windows installer
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: npx electron-builder --win nsis --config.win.requestedExecutionLevel=asInvoker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe
          if-no-files-found: error

  # ── macOS (one DMG per CPU) ──
  # Both architectures build on the Apple-silicon runner: bundle-tools.mjs
  # downloads the Intel Node runtime and asks npm for the x64 native packages
  # (TARGET_ARCH), and electron-builder fetches the x64 Electron itself.
  build-mac:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Also the Node version that gets bundled into the app.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Compile TypeScript (main process)
        run: npx tsc -p tsconfig.main.json

      - name: Build Vite (renderer)
        run: npx vite build

      - name: Bundle Node.js runtime and CLI tools (${{ matrix.arch }})
        run: node scripts/bundle-tools.mjs
        env:
          TARGET_ARCH: ${{ matrix.arch }}

      # No signing certificate in CI: the afterPack hook ad-hoc signs the app.
      - name: Package macOS DMG (${{ matrix.arch }})
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 30
          command: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error

  # ── Release ──
  # Publishes once the Windows installer is built; a failed Mac build leaves
  # its DMG out of the release instead of blocking it.
  release:
    needs: [check, build-windows, build-mac]
    if: ${{ !cancelled() && needs.check.outputs.exists == 'false' && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/*.exe
            artifacts/*.dmg
